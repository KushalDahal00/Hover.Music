<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hover.Music</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0000">
<style>
body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; margin:0; padding-bottom: 120px; }
.container { padding: 20px; max-width: 800px; margin: auto; }
input[type="text"] { width: 60%; padding: 10px; border-radius: 5px; border: none; margin-right: 10px; }
button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; background: #ff0000; color: #fff; }
.results { margin-top: 20px; }
.song { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; display:flex; justify-content: space-between; align-items:center; transition: background 0.3s; }
.song:hover { background: #333; }
.song-info { display: flex; align-items: center; }
.song-info img { width: 50px; height: 50px; border-radius: 5px; margin-right: 10px; }
#miniPlayer { position: fixed; bottom: 0; left: 0; right: 0; background: #111; display:flex; align-items:center; padding: 10px; box-shadow: 0 -2px 10px #000; border-top-left-radius: 10px; border-top-right-radius: 10px; z-index: 1000; transition: transform 0.3s ease; cursor: grab; }
#miniPlayer.minimized { transform: translateY(80px); cursor: pointer; }
#miniPlayer img { width: 60px; height: 60px; border-radius: 5px; margin-right: 10px; }
#miniPlayer .info { flex:1; overflow:hidden; }
#miniPlayer .info span { display:block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#miniPlayer .controls button { margin: 0 5px; }
#progressContainer { width: 100%; background: #333; height: 5px; border-radius: 5px; margin-top: 5px; cursor: pointer; }
#progressBar { width: 0%; height: 100%; background: #ff0000; border-radius: 5px; }
@media(max-width: 600px){ input[type="text"] { width: 50%; } .song-info img { width: 40px; height: 40px; } #miniPlayer img { width: 50px; height: 50px; } }
</style>
</head>
<body>

<div class="container">
<h1>Hover.Music</h1>
<div>
<input type="text" id="searchQuery" placeholder="Search songs...">
<button onclick="searchSongs()">Search</button>
<button onclick="loadFavorites()">Favorites</button>
</div>
<div class="results" id="results"></div>
</div>

<div id="miniPlayer" style="display:none;">
<img id="miniThumb" src="">
<div class="info">
<span id="miniTitle">No song playing</span>
<div id="progressContainer" onclick="seekSong(event)">
<div id="progressBar"></div>
</div>
</div>
<div class="controls">
<button onclick="prevSong()">⏮️</button>
<button onclick="togglePlay()">▶️/⏸️</button>
<button onclick="nextSong()">⏭️</button>
</div>
</div>

<div id="playerDiv"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, playlist = [], currentIndex = 0;
let isPlaying = false, shuffle = false, repeat = false;

if(localStorage.getItem('ytPlaylist')) {
  playlist = JSON.parse(localStorage.getItem('ytPlaylist'));
  displayResults();
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('playerDiv', {
    height: '1', width: '1', videoId: '',
    events: { 'onStateChange': onPlayerStateChange }
  });
}

function searchSongs() {
  const query = document.getElementById('searchQuery').value;
  fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(query)}&key=AIzaSyCQbe09aZKvRXQnOZXPat7NjYXLqdZtMgM&maxResults=10`)
    .then(res => res.json())
    .then(data => {
      playlist = data.items.map(item => ({
        id: item.id.videoId,
        title: item.snippet.title,
        thumb: item.snippet.thumbnails.default.url
      }));
      savePlaylist();
      displayResults();
    });
}

function displayResults() {
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';
  playlist.forEach((song, index) => {
    const div = document.createElement('div');
    div.className = 'song';
    div.onclick = () => playSong(index);

    const infoDiv = document.createElement('div');
    infoDiv.className = 'song-info';
    const img = document.createElement('img');
    img.src = song.thumb;
    const title = document.createElement('span');
    title.textContent = song.title;
    infoDiv.appendChild(img);
    infoDiv.appendChild(title);

    const saveBtn = document.createElement('button');
    saveBtn.textContent = '💾';
    saveBtn.onclick = (e) => { e.stopPropagation(); saveSong(song); };

    div.appendChild(infoDiv);
    div.appendChild(saveBtn);
    resultsDiv.appendChild(div);
  });
}

function playSong(index) {
  if (shuffle) index = Math.floor(Math.random() * playlist.length);
  currentIndex = index;
  const song = playlist[index];
  player.loadVideoById(song.id);
  player.playVideo();
  isPlaying = true;

  const mini = document.getElementById('miniPlayer');
  mini.style.display = 'flex';
  mini.classList.remove('minimized');
  document.getElementById('miniThumb').src = song.thumb;
  document.getElementById('miniTitle').textContent = song.title;
}

function togglePlay() {
  if (!player) return;
  if (isPlaying) { player.pauseVideo(); isPlaying = false; } 
  else { player.playVideo(); isPlaying = true; }
}

function nextSong() {
  if (shuffle) playSong(Math.floor(Math.random() * playlist.length));
  else if (currentIndex < playlist.length - 1) playSong(currentIndex + 1);
  else if (repeat) playSong(0);
}
function prevSong() {
  if (currentIndex > 0) playSong(currentIndex - 1);
  else if (repeat) playSong(playlist.length - 1);
}
function toggleShuffle() { shuffle = !shuffle; alert('Shuffle: ' + shuffle); }
function toggleRepeat() { repeat = !repeat; alert('Repeat: ' + repeat); }

setInterval(() => {
  if(player && player.getCurrentTime && player.getDuration) {
    const progress = (player.getCurrentTime() / player.getDuration()) * 100;
    document.getElementById('progressBar').style.width = progress + '%';
  }
}, 500);

function seekSong(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  const time = pos * player.getDuration();
  player.seekTo(time, true);
}

function savePlaylist() { localStorage.setItem('ytPlaylist', JSON.stringify(playlist)); }
function saveSong(song) {
  let favorites = JSON.parse(localStorage.getItem('ytFavorites') || '[]');
  if(!favorites.find(fav => fav.id === song.id)) {
    favorites.push(song);
    localStorage.setItem('ytFavorites', JSON.stringify(favorites));
    alert(`Saved "${song.title}" to favorites!`);
  } else { alert(`"${song.title}" already in favorites`); }
}
function loadFavorites() {
  playlist = JSON.parse(localStorage.getItem('ytFavorites') || '[]');
  displayResults();
}

function onPlayerStateChange(event) {
  if(event.data === YT.PlayerState.ENDED) nextSong();
}

// Mini-player swipe
const mini = document.getElementById('miniPlayer');
let startY = 0;
mini.addEventListener('touchstart', e => { startY = e.touches[0].clientY; });
mini.addEventListener('touchmove', e => {
  let delta = e.touches[0].clientY - startY;
  if(delta > 30) mini.classList.add('minimized');
  else mini.classList.remove('minimized');
});

// Register service worker for PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(()=>console.log('Service Worker Registered'));
}
</script>
</body>
</html>
