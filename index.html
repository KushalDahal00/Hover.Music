<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hover Music</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#FF0000">
</head>
<body>
<div class="top-menu">
  <div class="logo">Hover Music</div>
  <div class="menu-items">
    <div class="menu-item" onclick="goHome()"><span class="material-icons">home</span> Home</div>
    <div class="menu-item" onclick="goExplore()"><span class="material-icons">explore</span> Explore</div>
    <div class="menu-item" onclick="goLibrary()"><span class="material-icons">library_music</span> Library</div>
    <div class="menu-item" onclick="loadFavorites()"><span class="material-icons">favorite</span> Favorites</div>
  </div>
</div>

<div class="container">
  <div class="search-bar">
    <input type="text" id="searchQuery" placeholder="Search music...">
    <button onclick="searchSongs()">Search</button>
  </div>
  <div class="results" id="results"></div>
</div>

<!-- Mini-player -->
<div id="miniPlayer" style="display:none;">
  <img id="miniThumb" src="">
  <div class="info">
    <span id="miniTitle">No song playing</span>
    <div id="progressContainer" onclick="seekSong(event)">
      <div id="progressBar"></div>
    </div>
  </div>
  <div class="controls">
    <button onclick="prevSong()">⏮️</button>
    <button onclick="togglePlay()">▶️/⏸️</button>
    <button onclick="nextSong()">⏭️</button>
    <button onclick="toggleShuffle()">🔀</button>
    <button onclick="toggleRepeat()">🔁</button>
  </div>
</div>

<!-- Full-screen player -->
<div id="fullPlayer">
  <img id="fullThumb" src="">
  <div class="songInfo">
    <span id="fullTitle"></span>
    <span id="fullArtist"></span>
  </div>
  <div id="fullProgressContainer" style="width:80%; height:4px; background:#333; border-radius:4px; margin-bottom:20px; cursor:pointer;">
    <div id="fullProgressBar" style="width:0%; height:100%; background:#FF0000; border-radius:4px;"></div>
  </div>
  <div class="controls">
    <button onclick="prevSong()">⏮️</button>
    <button onclick="togglePlay()">▶️/⏸️</button>
    <button onclick="nextSong()">⏭️</button>
  </div>
</div>

<div id="playerDiv"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, playerReady=false, playlist=[], currentIndex=0, isPlaying=false, shuffle=false, repeat=false;

window.addEventListener('load', ()=>{ goHome(); });

function onYouTubeIframeAPIReady(){
  player = new YT.Player('playerDiv',{
    height:'1', width:'1', videoId:'',
    playerVars:{ autoplay:0, controls:0, disablekb:1, modestbranding:1, rel:0, playsinline:1 },
    events:{ 'onReady':()=>{playerReady=true; initAfterPlayerReady();}, 'onStateChange':onPlayerStateChange }
  });
}

function initAfterPlayerReady(){
  const savedPlaylist = JSON.parse(localStorage.getItem('ytPlaylist') || '[]');
  const savedIndex = parseInt(localStorage.getItem('currentIndex') || '0');
  if(savedPlaylist.length>0){ playlist=savedPlaylist; displayResults(); if(playlist[savedIndex]){ currentIndex=savedIndex; const song=playlist[currentIndex]; document.getElementById('miniPlayer').style.display='flex'; document.getElementById('miniThumb').src=song.thumb; document.getElementById('miniTitle').textContent=song.title; isPlaying=false; updateMediaSession(); }} 
}

function searchSongs(query){
  if(!query) query=document.getElementById('searchQuery').value;
  fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(query)}&key=AIzaSyCQbe09aZKvRXQnOZXPat7NjYXLqdZtMgM0`)
  .then(res=>res.json())
  .then(data=>{ playlist=data.items.map(item=>({id:item.id.videoId,title:item.snippet.title,thumb:item.snippet.thumbnails.medium.url,channelTitle:item.snippet.channelTitle})); currentIndex=0; savePlaylist(); displayResults(); })
  .catch(err=>console.log('YT API error:',err));
}

function displayResults(){
  const resultsDiv=document.getElementById('results'); resultsDiv.innerHTML='';
  if(playlist.length===0){ resultsDiv.innerHTML='<p style="color:#888;">No songs found.</p>'; return; }
  playlist.forEach((song,index)=>{
    const div=document.createElement('div'); div.className='song'; div.onclick=()=>playSong(index);
    const infoDiv=document.createElement('div'); infoDiv.className='song-info';
    const img=document.createElement('img'); img.src=song.thumb;
    const title=document.createElement('span'); title.innerHTML=`<b>${song.title}</b><br><small>${song.channelTitle||'Unknown Artist'}</small>`;
    infoDiv.appendChild(img); infoDiv.appendChild(title);
    const saveBtn=document.createElement('button'); saveBtn.textContent='💾'; saveBtn.onclick=(e)=>{e.stopPropagation(); saveSong(song);}
    div.appendChild(infoDiv); div.appendChild(saveBtn); resultsDiv.appendChild(div);
  });
}

function playSong(index){
  if(!playerReady){ setTimeout(()=>playSong(index),200); return; }
  if(shuffle) index=Math.floor(Math.random()*playlist.length);
  currentIndex=index;
  const song=playlist[index];
  player.loadVideoById(song.id); player.playVideo(); isPlaying=true;
  const mini=document.getElementById('miniPlayer'); mini.style.display='flex'; mini.classList.remove('minimized');
  document.getElementById('miniThumb').src=song.thumb; document.getElementById('miniTitle').textContent=song.title;
  updateMediaSession();
  savePlaylist();
}

function togglePlay(){ if(!player) return; isPlaying?(player.pauseVideo(),isPlaying=false):(player.playVideo(),isPlaying=true);}
function nextSong(){ if(shuffle) playSong(Math.floor(Math.random()*playlist.length)); else if(currentIndex<playlist.length-1) playSong(currentIndex+1); else if(repeat) playSong(0);}
function prevSong(){ if(currentIndex>0) playSong(currentIndex-1); else if(repeat) playSong(playlist.length-1);}
function toggleShuffle(){ shuffle=!shuffle; alert('Shuffle: '+(shuffle?'ON':'OFF'));}
function toggleRepeat(){ repeat=!repeat; alert('Repeat: '+(repeat?'ON':'OFF'));}
setInterval(()=>{ if(player && player.getCurrentTime && player.getDuration){ const p=(player.getCurrentTime()/player.getDuration())*100; document.getElementById('progressBar').style.width=p+'%'; document.getElementById('fullProgressBar').style.width=p+'%'; } },500);
function seekSong(e){ const rect=e.currentTarget.getBoundingClientRect(); const pos=(e.clientX-rect.left)/rect.width; player.seekTo(pos*player.getDuration(),true);}
function savePlaylist(){ localStorage.setItem('ytPlaylist',JSON.stringify(playlist)); localStorage.setItem('currentIndex',currentIndex);}
function saveSong(song){ let fav=JSON.parse(localStorage.getItem('ytFavorites')||'[]'); if(!fav.find(f=>f.id===song.id)){ fav.push(song); localStorage.setItem('ytFavorites',JSON.stringify(fav)); alert(`Saved "${song.title}"`);} else alert('Already saved'); }
function loadFavorites(){ playlist=JSON.parse(localStorage.getItem('ytFavorites')||'[]'); displayResults();}

// Mini player swipe
const mini=document.getElementById('miniPlayer'); let startY=0;
mini.addEventListener('touchstart',e=>startY=e.touches[0].clientY);
mini.addEventListener('touchmove',e=>{ let delta=e.touches[0].clientY-startY; if(delta>30) mini.classList.add('minimized'); else mini.classList.remove('minimized'); });

// Top menu functions
function goHome(){ searchSongs("Top Trending Music"); }
function goExplore(){ searchSongs("Recommended Music"); }
function goLibrary(){ playlist=JSON.parse(localStorage.getItem('ytFavorites')||'[]'); displayResults(); }
function onPlayerStateChange(event){ if(event.data===YT.PlayerState.ENDED) nextSong(); }

// Full player overlay
const fullPlayer = document.getElementById('fullPlayer');
document.getElementById('miniPlayer').addEventListener('click', ()=>{
  const song = playlist[currentIndex];
  fullPlayer.style.display='flex';
  document.getElementById('fullThumb').src=song.thumb;
  document.getElementById('fullTitle').textContent=song.title;
  document.getElementById('fullArtist').textContent=song.channelTitle||'Unknown Artist';
});
let startFullY=0;
fullPlayer.addEventListener('touchstart', e=>{ startFullY=e.touches[0].clientY; fullPlayer.classList.add('dragging'); });
fullPlayer.addEventListener('touchmove', e=>{
  let delta = e.touches[0].clientY - startFullY;
  if(delta>0) fullPlayer.style.transform=`translateY(${delta}px)`;
});
fullPlayer.addEventListener('touchend', e=>{
  fullPlayer.classList.remove('dragging');
  let delta = e.changedTouches[0].clientY - startFullY;
  if(delta>100) { fullPlayer.style.display='none'; fullPlayer.style.transform='translateY(0)'; }
  else fullPlayer.style.transform='translateY(0)';
});
document.getElementById('fullProgressContainer').addEventListener('click', e=>{
  const rect = e.currentTarget.getBoundingClientRect();
  const pos = (e.clientX - rect.left)/rect.width;
  player.seekTo(pos*player.getDuration(),true);
});

// Media Session API for background playback & lock screen controls
function updateMediaSession(){
  if('mediaSession' in navigator && playlist[currentIndex]){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: playlist[currentIndex].title,
      artist: playlist[currentIndex].channelTitle || 'Unknown Artist',
      artwork: [{src: playlist[currentIndex].thumb, sizes:'512x512', type:'image/png'}]
    });
    navigator.mediaSession.setActionHandler('play', ()=>{ player.playVideo(); isPlaying=true; });
    navigator.mediaSession.setActionHandler('pause', ()=>{ player.pauseVideo(); isPlaying=false; });
    navigator.mediaSession.setActionHandler('previoustrack', prevSong);
    navigator.mediaSession.setActionHandler('nexttrack', nextSong);
  }
}

// Register service worker
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').then(()=>console.log('Service Worker Registered')); }

</script>
</body>
</html>
